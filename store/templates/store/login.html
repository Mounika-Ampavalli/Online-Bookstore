{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Paper Pulse</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>

{% include 'store/navbar.html' %}

<div class="auth-wrapper">

    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to continue shopping</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>

        <p class="auth-footer">
            Don’t have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>
    </div>

</div>

</body>
</html>
